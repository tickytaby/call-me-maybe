[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Natural language to function calls with constrained decoding on Qwen3-0.6B"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.13.5",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[tool.mypy]
exclude = ["^\\.venv/", "^llm_sdk/"]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
python_files = ["*_test.py"]
